name: Build and audit
on: [push, pull_request]
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: cargo build --release
      - run: cargo test --locked
      - run: python3 tests/test_iam.py
      - run: python3 tests/e2e.py target/release/basset
      - run: target/release/basset git .
