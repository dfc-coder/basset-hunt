[package]
name = "basset-hunt"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Offline credential exposure scanner for local assets and Git history"
publish = false

[[bin]]
name = "basset"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = { version = "0.23.1", default-features = false, features = ["std"] }
clap = { version = "4", features = ["derive"] }
hex = "0.4"
hmac = "0.12"
secrets_scanner = { version = "=0.2.3", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
walkdir = "2"

[patch.crates-io]
secrets_scanner = { path = "vendor/secrets_scanner" }
